# Netlify config for Cassandra Christodolo's portfolio
# Eleventy build, password protection on all /work/* case studies

[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long cache for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Password protection on every case study.
# These role rules require Netlify Identity with role based access.
# Alternative: enable site-wide visitor password in Netlify dashboard
# and remove these redirects.
[[redirects]]
  from = "/work/amnesty/*"
  to = "/work/amnesty/:splat"
  status = 200
  conditions = {Role = ["client", "admin"]}

[[redirects]]
  from = "/work/hearing-dogs/*"
  to = "/work/hearing-dogs/:splat"
  status = 200
  conditions = {Role = ["client", "admin"]}

[[redirects]]
  from = "/work/gstt/*"
  to = "/work/gstt/:splat"
  status = 200
  conditions = {Role = ["client", "admin"]}

[[redirects]]
  from = "/work/start-network/*"
  to = "/work/start-network/:splat"

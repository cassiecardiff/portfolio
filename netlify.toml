# Netlify config for Cassandra Christodolo's portfolio.
# Case studies are password protected via a client side gate
# in src/assets/js/case-gate.js. No Netlify Identity needed.

[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Anyone arriving on the old domain lands on a small "name changed" splash
# page before being sent on to the new homepage.
[[redirects]]
  from = "https://cassandracardiff.com/*"
  to = "https://casschristodolo.com/welcome/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.cassandracardiff.com/*"
  to = "https://casschristodolo.com/welcome/"
  status = 301
  force = true
